<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LingoDeck · Mất kết nối</title>
<style>
  :root { color-scheme: light dark; --bg:#F7F8FA; --fg:#181D26; --muted:#646A74; --primary:#0E7C72; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0F1114; --fg:#F2F4F7; --muted:#949AA4; --primary:#3CC4B4; } }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/24px system-ui,-apple-system,sans-serif; padding:24px; box-sizing:border-box; text-align:center; }
  h1 { font-size:24px; line-height:32px; font-weight:600; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 24px; }
  button { height:52px; padding:0 24px; border:0; border-radius:14px; background:var(--primary); color:#fff; font:600 16px system-ui; }
</style>
</head>
<body>
  <main>
    <h1>Bạn đang ngoại tuyến</h1>
    <p>Kết nối mạng để tiếp tục học. Tiến độ đã lưu vẫn an toàn.</p>
    <button onclick="location.reload()">Thử lại</button>
  </main>
</body>
</html>
